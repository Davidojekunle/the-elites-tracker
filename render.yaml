services:
  - type: web
    name: cs-tracker
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: sudo apt-get install -y tesseract-ocr poppler-utils && pip install -r requirements.txt && cd frontend && npm install && npx vite build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false