services:
  - type: web
    name: cs-tracker
    runtime: python
    buildCommand: apt-get install -y tesseract-ocr poppler-utils && pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # you paste this manually in Render dashboard